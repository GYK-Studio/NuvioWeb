name: Nuvio Remote Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "apps/remote/**"
      - "services/remote/**"
      - "js/core/remote/**"
      - ".github/workflows/remote-android.yml"
  pull_request:
    paths:
      - "apps/remote/**"
      - "services/remote/**"
      - "js/core/remote/**"
      - ".github/workflows/remote-android.yml"

permissions:
  contents: write

concurrency:
  group: remote-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release version
        id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./apps/remote/app.json').expo.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install app and service dependencies
        run: |
          pnpm --dir apps/remote install --ignore-workspace --frozen-lockfile --ignore-scripts --prod=false
          pnpm --dir services/remote install --ignore-workspace --frozen-lockfile --ignore-scripts --prod=false
          pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts --prod=false
      - name: Check TypeScript and remote protocol
        run: |
          pnpm --dir apps/remote typecheck
          pnpm --dir apps/remote test
          pnpm --dir services/remote test
          node --test services/remote/content.test.mjs services/remote/mobile.test.mjs
      - name: Generate Android project
        working-directory: apps/remote
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build standalone testing APK
        working-directory: apps/remote/android
        # Expo's generated release variant uses the template debug signing key.
        # This APK bundles JavaScript and needs neither Metro nor an Expo account.
        # It is for sideload testing, NOT a Play Store release.
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Upload installable testing APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-remote-android-v${{ steps.metadata.outputs.version }}-${{ github.run_number }}
          path: apps/remote/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Attach APK to version release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp apps/remote/android/app/build/outputs/apk/release/*.apk "nuvio-remote-${{ github.ref_name }}.apk"
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nuvio-remote-${{ github.ref_name }}.apk
          generate_release_notes: true
